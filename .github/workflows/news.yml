name: news-watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # حداقل فاصله‌ی مجاز GitHub: هر ۵ دقیقه (گاهی با تاخیر)
  workflow_dispatch:
    inputs:
      test:
        description: "فقط یک پیام آزمایشی به تلگرام بفرست"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send test message
        if: ${{ inputs.test == true }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_watcher.py --test

      - name: Check feeds
        if: ${{ inputs.test != true }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: ${{ vars.KEYWORDS }}
        run: python news_watcher.py --once

      - name: Save state
        if: ${{ inputs.test != true }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
